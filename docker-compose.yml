version: '3.8'

services:
  plex-command-center:
    build:
      context: .
      dockerfile: Dockerfile-v2.5.2
    container_name: plex-command-center
    restart: unless-stopped
    ports:
      - "3001:3001"
      # Plex reverse-proxy gateway port. Off by default; enable by setting
      # PCC_GATEWAY_ENABLED=1 in your override. Point your router's public port forward
      # at THIS host:32400 (not PMS directly) so foreign-geo traffic hits the deny page
      # before reaching Plex.
      - "32400:32400"
      # Same gateway, alternate port: use this when PMS runs on the same host on 32400.
      # Configure gateway_port=32401 in the Security tab and forward router WAN :32400 here.
      - "32401:32401"
    environment:
      # Plex - REQUIRED
      - PLEX_URL=http://YOUR_PLEX_IP:32400
      - PLEX_TOKEN=YOUR_PLEX_TOKEN

      # Tautulli - Optional (for user stats & watch history)
      - TAUTULLI_URL=http://YOUR_TAUTULLI_IP:8181
      - TAUTULLI_API_KEY=YOUR_TAUTULLI_API_KEY

      # Jellyseerr - Optional (for media requests)
      - JELLYSEERR_URL=http://YOUR_JELLYSEERR_IP:5055
      - JELLYSEERR_API_KEY=YOUR_JELLYSEERR_API_KEY

      # Zabbix - Optional (for real Plex server hardware metrics)
      # - ZABBIX_URL=http://YOUR_ZABBIX_IP/zabbix
      # - ZABBIX_USER=Admin
      # - ZABBIX_PASSWORD=YOUR_ZABBIX_PASSWORD
      # - ZABBIX_HOST_ID=YOUR_HOST_ID

      # Network IPs - Optional (for display purposes)
      # - TAILSCALE_IP=YOUR_TAILSCALE_IP
      # - LOCAL_IP=YOUR_LOCAL_IP

      # App settings
      - PORT=3001
      - NODE_ENV=production
      - TZ=UTC

      # Virtual Linear TV
      - LIVETV_ENABLED=true
      # - LIVETV_BASE_URL=http://YOUR_SERVER_IP:3001
      - LIVETV_GUIDE_HOURS=48
      - LIVETV_FILLER_INTERVAL=3

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

    networks:
      - plex-network

  # ---------------------------------------------------------------------------
  # PCC TCP-Front sidecar (opt-in)
  # ---------------------------------------------------------------------------
  # Pure TCP pass-through on :32401 with IP-level geofence. Only useful when
  # Plex Media Server is on the SAME Linux host as this stack. Reads PCC's
  # pcc.db for geofence config, writes decisions back to gateway_log.
  #
  # Disabled by default. Enable on a host that runs Plex with:
  #   docker compose --profile tcp-front up -d
  # or persistently:
  #   export COMPOSE_PROFILES=tcp-front
  #
  # network_mode: host is REQUIRED (Linux only):
  #   - to see the real client IP for the geofence check
  #   - to reach Plex on 127.0.0.1:32400 via host loopback
  # Don't add a `ports:` block; host mode shares the host's network namespace.
  pcc-tcp-front:
    build:
      context: ./windows/tcp-front
    container_name: pcc-tcp-front
    restart: unless-stopped
    profiles: ["tcp-front"]
    network_mode: host
    environment:
      - TCP_PORT=32401
      - PMS_HOST=127.0.0.1     # Plex Media Server on the docker host
      - PMS_PORT=32400
      - PCC_DB_PATH=/pcc-data/pcc.db
    volumes:
      # Mount PCC's data dir; the sidecar reads regional settings + writes gateway_log
      - ./data:/pcc-data
    depends_on:
      - plex-command-center

networks:
  plex-network:
    driver: bridge
